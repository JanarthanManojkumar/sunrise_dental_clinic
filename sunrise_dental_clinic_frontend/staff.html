<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental Clinic - Manage Staff Accounts</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page page-wide">
        <div class="banner">Manage Staff Accounts</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="content">
            <form id="staffForm" class="form-grid">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" required>
                <label for="role">Role:</label>
                <select id="role">
                    <option value="RECEPTIONIST">Receptionist</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </form>
            <div class="button-row">
                <button type="submit" form="staffForm" class="primary">Create Account</button>
                <button onclick="location.href='dashboard.html'">Back to Dashboard</button>
            </div>
            <div id="message" class="message error"></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/staff.js"></script>
</body>
</html>
