<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental Clinic - Manage Patients</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page page-wide">
        <div class="banner">Manage Patients</div>
        <div class="content">
            <form id="searchForm" class="form-grid">
                <label for="query">Name or contact number:</label>
                <input type="text" id="query">
            </form>
            <div class="button-row">
                <button type="submit" form="searchForm" class="primary">Search</button>
                <button onclick="location.href='dashboard.html'">Back to Dashboard</button>
            </div>
            <div id="message" class="message error"></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Contact</th><th>Address</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="content" id="detailPanel" hidden>
            <h3>Patient History</h3>
            <div id="detailPatient"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Appointment No</th><th>Dentist</th><th>Treatment</th><th>Date</th><th>Time</th><th>Status</th></tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/patients.js"></script>
</body>
</html>
