<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental Clinic - Reports</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page page-wide">
        <div class="banner">Reports</div>
        <div class="report-controls">
            <label for="reportType">Report:</label>
            <select id="reportType">
                <option value="appointments-per-day">Appointments per day</option>
                <option value="revenue-per-dentist">Revenue per dentist</option>
                <option value="upcoming">Upcoming appointments</option>
            </select>
            <button class="primary" id="btnGenerate">Generate</button>
            <button onclick="location.href='dashboard.html'">Back to Dashboard</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="message" class="message error"></div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
